# Despliegue del front en Netlify.
#
# El proxy de /api/* hacia Render NO es un detalle de comodidad: hace que el
# navegador vea front y API en el MISMO ORIGEN. Sin él, la cookie de sesión
# httpOnly tendría que ser SameSite=None, que debilita la protección CSRF que
# ADR-0009 obtuvo gratis con SameSite=Lax. Con el proxy, esa decisión se
# mantiene tal cual en la nube.
#
# Reemplazar POS_API_URL por la URL del servicio de Render.

[build]
  base = "."
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm build:web"
  publish = "apps/pos-web/dist"

[build.environment]
  NODE_VERSION = "20"

# API -> Render (mismo origen para el navegador).
[[redirects]]
  from = "/api/*"
  to = "https://POS_API_URL.onrender.com/api/:splat"
  status = 200
  force = true

# SPA: cualquier ruta del front devuelve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
